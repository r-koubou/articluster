name: Build csproj project

on:
  workflow_call:
    inputs:
      prefix:
        required: true
        type: string
        description: |
          The prefix string to use for the artifact name.
      base_dir:
        required: true
        type: string
        description: |
          The base directory path of the .csproj file to build. (relative to repository root)
      csproject_filename:
        required: true
        type: string
        description: |
          The path to the .csproj file name to build.
      version:
        required: false
        type: string
        default: ""
        description: |
          Application version to set (e.g.: 1.2.3).
      configuration:
        required: true
        type: string
        default: "Debug"
        description: |
          dotnet Build configuration (Debug, Release)
      dotnet_custom_build_properties:
        required: false
        type: string
        default: ""
        description: |
          Additional properties to pass to dotnet build/publish command (e.g.: "-p:CustomProperty=Value -p:AnotherProperty=AnotherValue")

  workflow_dispatch:
    inputs:
      prefix:
        required: true
        type: string
        description: |
          The prefix string to use for the artifact name.
      base_dir:
        required: true
        type: string
        description: |
          The base directory path of the .csproj file to build. (relative to repository root)
      csproject_filename:
        required: true
        type: string
        description: |
          The path to the .csproj file name to build.
      version:
        required: false
        type: string
        default: ""
        description: |
          Application version to set (e.g.: 1.2.3).
      configuration:
        required: true
        type: choice
        options:
          - Debug
          - Release
        description: |
          dotnet Build configuration (Debug, Release)
      dotnet_custom_build_properties:
        required: false
        type: string
        default: ""
        description: |
          Additional properties to pass to dotnet build/publish command (e.g.: "/p:CustomProperty=Value /p:AnotherProperty=AnotherValue")

#--------------------------------------------------------------
# Build C# project
#--------------------------------------------------------------
jobs:
  build-csproj:
    name: build (${{ inputs.configuration }})
    runs-on: ubuntu-latest
    env:
      DOTNET_SDK_VERSION: ${{ vars.DOTNET_SDK_VERSION }}
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      PREFIX: ${{ inputs.prefix }}
      CSPROJ_FILENAME: ${{ inputs.csproject_filename }}
      BASE_DIR: ${{ github.workspace }}/${{ inputs.base_dir }}
      PUBLISH_DIRNAME: publish
      BUILD_CONFIGURATION: ${{ inputs.configuration }}
      DOTNET_CUSTOM_BUILD_PROPERTIES: ${{ inputs.dotnet_custom_build_properties }}
    steps:
    - name: Show workflow inputs
      run: |
        {
          echo "## Workflow Inputs"
          echo ""
          echo "|name|value|"
          echo "|----|-----|"
          echo "|ref| ${{ github.ref }}|"
          echo "|Commit SHA| ${{ github.sha }}|"
          echo "|Version|${{ inputs.version }}|"
          echo "|Configuration|${{ inputs.configuration }}|"
          echo "|Prefix|${{ inputs.prefix }}|"
          echo "|Base Directory|${{ inputs.base_dir }}|"
          echo "|csproj Filename|${{ inputs.csproject_filename }}|"
          echo "|Dotnet Custom Build Properties|${{ inputs.dotnet_custom_build_properties }}|"
          echo ""
        } >> $GITHUB_STEP_SUMMARY

    #----------------------------------------------------------
    # Guard - tag build must be Release Configuration
    #----------------------------------------------------------
    - name: Guard - tag build must be Release Configuration
      if: ${{ startsWith(github.ref, 'refs/tags/v') && inputs.configuration != 'Release' }}
      run: |
        echo "::error::Must use configuration=Release when building from tag/v*"
        exit 1

    #----------------------------------------------------------
    # Setup Environment Variables
    #----------------------------------------------------------
    - name: Sanitize Branch Name
      run: echo "BRANCH_NAME=$(echo ${{ github.ref_name }} | sed 's|/|-|g')" >> $GITHUB_ENV

    - name:  Setup csproj file path variable
      run: |
        echo "CSPROJ_PATH=${{ env.BASE_DIR }}/${{ env.CSPROJ_FILENAME }}" >> $GITHUB_ENV

    - name: Setup Publish Directory Variable
      run: |
        echo "PUBLISH_DIR=${{ env.BASE_DIR }}/${{ env.PUBLISH_DIRNAME }}" >> $GITHUB_ENV
        echo "PUBLISH_RELATIVE_DIR_FROM_BASE=${{ env.PUBLISH_DIRNAME }}" >> $GITHUB_ENV

    - name: Setup Version Information Path Variable
      run: |
        echo "VERSION_INFO_PATH=${{ env.PUBLISH_DIR }}/VERSION.txt" >> $GITHUB_ENV

    #----------------------------------------------------------
    # Checkout repository
    #----------------------------------------------------------
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    #----------------------------------------------------------
    # Setup the application version
    #----------------------------------------------------------
    - name: "Setup the application version (If inputs.version is empty)"
      if: ${{ inputs.version == '' }}
      run: |
          echo "::info::The version value will be '0.0.0'"
          echo "BUILD_VERSION=0.0.0" >> $GITHUB_ENV

    - name: "Setup the application version (Use inputs.version)"
      if: ${{ inputs.version != '' }}
      run: |
        echo "::info::The version value will be overridden to '${{ inputs.version }}'"
        echo "BUILD_VERSION=${{ inputs.version }}" >> $GITHUB_ENV

    #----------------------------------------------------------
    # Setup the artifact name
    #----------------------------------------------------------
    - name: Setup the artifact name
      run: |
        echo "ARTIFACT_NAME=${{ env.PREFIX }}-${{ env.BUILD_CONFIGURATION }}-v${{ env.BUILD_VERSION }}-${{ inputs.configuration }}" >> $GITHUB_ENV

    - name: Show the artifact name
      run: |
        {
          echo "## Artifact Name"
          echo ""
          echo "${{ env.ARTIFACT_NAME }}"
        } >> $GITHUB_STEP_SUMMARY

    #----------------------------------------------------------
    # Show setup Environment Variables
    #----------------------------------------------------------
    - name: Show Environment Variables
      run: |
        {
          echo "## Environment Variables"
          echo ""
          echo "<details>"
          echo "<summary>Click to expand</summary>"
          echo ""
          echo "|name|value|"
          echo "|----|-----|"
          echo "|PREFIX|${{ env.PREFIX }}|"
          echo "|DOTNET_SDK_VERSION|${{ env.DOTNET_SDK_VERSION }}|"
          echo "|BASE_DIR|${{ env.BASE_DIR }}|"
          echo "|CSPROJ_PATH|${{ env.CSPROJ_PATH }}|"
          echo "|PUBLISH_DIR|${{ env.PUBLISH_DIR }}|"
          echo "|BUILD_CONFIGURATION|${{ env.BUILD_CONFIGURATION }}|"
          echo "|BUILD_VERSION|${{ env.BUILD_VERSION }}|"
          echo "|DOTNET_CUSTOM_BUILD_PROPERTIES|${{ env.DOTNET_CUSTOM_BUILD_PROPERTIES }}|"
          echo "|VERSION_INFO_PATH|${{ env.VERSION_INFO_PATH }}|"
          echo "|ARTIFACT_NAME|${{ env.ARTIFACT_NAME }}|"
          echo ""
          echo "</details>"
        } >> $GITHUB_STEP_SUMMARY


    #----------------------------------------------------------
    # Setup .NET SDK
    #----------------------------------------------------------
    - name: Install .NET SDK
      uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
      with:
        dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

    #----------------------------------------------------------
    # Show .csproj file
    #----------------------------------------------------------
    - name: Show .csproj file
      run: |
        {
          echo "## .csproj file content"
          echo ""
          echo "<details>"
          echo "<summary>Click to expand</summary>"
          echo ""
          echo "\`\`\`xml"
          cat ${{ env.CSPROJ_PATH }}
          echo "\`\`\`"
          echo ""
          echo "</details>"
          echo ""
        } >> $GITHUB_STEP_SUMMARY

    #----------------------------------------------------------
    # Build
    #----------------------------------------------------------
    - name: Build Project
      run: |
        pushd ${{ env.BASE_DIR }}
        dotnet \
          publish ${{ env.CSPROJ_PATH }} \
          -p:FileVersion=${{ env.BUILD_VERSION }} \
          -p:Version=${{ env.BUILD_VERSION }} \
          -p:AssemblyVersion=${{ env.BUILD_VERSION }} \
          -c ${{ env.BUILD_CONFIGURATION }} \
          -o ${{ env.PUBLISH_RELATIVE_DIR_FROM_BASE }} \
          ${{ env.DOTNET_CUSTOM_BUILD_PROPERTIES }}
        popd

    #----------------------------------------------------------
    # Create Version Information File
    #----------------------------------------------------------
    - name: Create Version information file
      run: |
        mkdir -p ${{ env.PUBLISH_DIR }}
        {
          echo "Build Configuration: ${{ env.BUILD_CONFIGURATION }}"
          echo "Build date: $(date)"
          echo "Version: ${{ env.BUILD_VERSION }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
        } >> ${{ env.VERSION_INFO_PATH }}

    - name: Show Version information file
      run: |
        {
          if [ -f ${{ env.VERSION_INFO_PATH }} ]; then
            echo "## Version Information File"
            echo ""
            echo "\`\`\`"
            cat ${{ env.VERSION_INFO_PATH }}
            echo ""
            echo "\`\`\`"
          fi
        } >> $GITHUB_STEP_SUMMARY

    #----------------------------------------------------------
    # Create Artifact
    #----------------------------------------------------------
    - name: Create Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: ${{ env.BASE_DIR }}/${{ env.PUBLISH_DIRNAME }}
